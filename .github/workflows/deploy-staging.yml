name: Deploy CricPR Admin - Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cricpr-admin-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Staging
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_STAGING }}
        run: pnpm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Deploy staging build
        env:
          DEPLOY_PATH: ${{ vars.STAGING_PATH }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_PATH" != "/var/www/staging-cricpr-v2-admin" ]; then
            echo "Unexpected staging deployment path"
            exit 1
          fi

          RELEASES="$DEPLOY_PATH/releases"
          RELEASE="$RELEASES/$GITHUB_SHA"

          mkdir -p "$RELEASES"
          mkdir -p "$RELEASE"

          cp -a dist/. "$RELEASE/"

          ln -sfn "releases/$GITHUB_SHA" "$DEPLOY_PATH/current-new"
          mv -Tf "$DEPLOY_PATH/current-new" "$DEPLOY_PATH/current"

          # Retain the latest five releases
          find "$RELEASES" -mindepth 1 -maxdepth 1 \
            -type d -printf '%T@ %p\n' |
            sort -rn |
            tail -n +6 |
            cut -d' ' -f2- |
            while IFS= read -r old_release; do
              rm -rf -- "$old_release"
            done

          echo "Staging deployment completed successfully."
